# embeddings_server — one GPU (torch) service serving bge-reranker-v2-m3
# (/v1/rerank, live) and bge-m3 dense+sparse (/embed, gated by EMBED_ENABLED).
# Joins the shared cortex-kb network so its clients reach it by hostname (a machine whose other apps reach it on another
# network attaches that one in an uncommitted docker-compose.local.yml)
# `embeddings-server:8600`. Replaces llama.cpp's rerank duty; embeddings light
# up at the sparse/hybrid cutover.
services:
  embeddings-server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: embeddings-server:1.0
    container_name: embeddings-server
    command: ["uvicorn","app:app","--host","0.0.0.0","--port","8600","--log-level","info"]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_DISABLE_REQUIRE: "1"
      RERANK_MODEL_PATH: /models/bge-reranker-v2-m3
      RERANK_MAX_BATCH: "64"
      # the models' own limit (8192: config.json); 512 cut 7.4% of Cortex's passages, measured 2026-10-18 (cortex register
      # #108). Batches stay within RERANK_TOKEN_BUDGET / EMBED_TOKEN_BUDGET padded tokens (app.py _groups)
      RERANK_MAX_LENGTH: "${RERANK_MAX_LENGTH:-8192}"
      EMBED_MAX_LENGTH: "${EMBED_MAX_LENGTH:-8192}"
      RERANK_BATCH_WINDOW_MS: "5"
      EMBED_ENABLED: "true"           # sparse for hybrid retrieval
      # cuda since 2026-10-14: ingestion embeds 200-500 passages/s against 1.8 on the CPU (a 4,400-passage domain in
      # seconds instead of 40 minutes); 1.34 GB of VRAM at a batch of 32, one batch in flight (EMBED_CONCURRENCY) so
      # the card is never overcommitted beside the model, Whisper and the voices (WSL pages silently when it is)
      EMBED_DEVICE: "${EMBED_DEVICE:-cuda}"
      EMBED_MODEL_PATH: /models/bge-m3
      EMBED_CONCURRENCY: "${EMBED_CONCURRENCY:-1}"   # /embed requests computed at once (app.py); one on the GPU
      # the /admin routes' bearer token (Cortex sends it: CORTEX_EMBED_ADMIN_TOKEN); empty = open. /admin/gpu-memory (idle
      # release) and /admin/release + /admin/load (the lease: both models to host RAM while Cortex renders a movie)
      ADMIN_TOKEN: "${EMBEDDINGS_ADMIN_TOKEN:-}"
    volumes:
      # its own models (data/models, beside this compose folder; cortex/deploy/install.sh downloads them)
      - ../data/models/bge-reranker-v2-m3:/models/bge-reranker-v2-m3:ro
      - ../data/models/bge-m3:/models/bge-m3:ro
    ports:
      - "8601:8600"                   # host debug; app uses embeddings-server:8600 on the network
    networks:
      - cortex-kb
    restart: unless-stopped

networks:
  cortex-kb:
    external: true
