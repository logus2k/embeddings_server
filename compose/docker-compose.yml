# embeddings_server — one GPU (torch) service serving bge-reranker-v2-m3
# (/v1/rerank, live) and bge-m3 dense+sparse (/embed, gated by EMBED_ENABLED).
# Joins the shared cortex-kb network so its clients reach it by hostname (a machine whose other apps reach it on another
# network attaches that one in an uncommitted docker-compose.local.yml)
# `embeddings-server:8600`. Replaces llama.cpp's rerank duty; embeddings light
# up at the sparse/hybrid cutover.
services:
  embeddings-server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: embeddings-server:1.0
    container_name: embeddings-server
    command: ["uvicorn","app:app","--host","0.0.0.0","--port","8600","--log-level","info"]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_DISABLE_REQUIRE: "1"
      RERANK_MODEL_PATH: /models/bge-reranker-v2-m3
      RERANK_MAX_BATCH: "64"
      RERANK_BATCH_WINDOW_MS: "5"
      EMBED_ENABLED: "true"           # sparse for hybrid retrieval
      EMBED_DEVICE: "cpu"             # sparse on CPU = 0 VRAM (query-time, one short text)
      EMBED_MODEL_PATH: /models/bge-m3
      EMBED_CONCURRENCY: "${EMBED_CONCURRENCY:-4}"   # /embed requests computed at once (app.py)
    volumes:
      # its own models (data/models, beside this compose folder; cortex/deploy/install.sh downloads them)
      - ../data/models/bge-reranker-v2-m3:/models/bge-reranker-v2-m3:ro
      - ../data/models/bge-m3:/models/bge-m3:ro
    ports:
      - "8601:8600"                   # host debug; app uses embeddings-server:8600 on the network
    networks:
      - cortex-kb
    restart: unless-stopped

networks:
  cortex-kb:
    external: true
